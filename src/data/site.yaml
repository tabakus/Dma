# Глобальные настройки сайта. Ключ `settings` — обязательная обёртка (так устроен загрузчик данных Astro).
# Схема полей: src/lib/schemas.ts → siteSchema.
settings:
  name: "Deutsch mit Akzent"
  # Язык первой версии сайта — русский (утверждено, см. docs/open-questions.md). Тексты интерфейса ниже — технические заглушки.
  locale: ru
  defaultDescription: "Deutsch mit Akzent — авторская онлайн-школа немецкого языка."
  contactEmail: null          # не утверждён
  # Основное меню. «Обучение» и «Об авторе» ведут к разделам главной страницы; «Грамматика» и «Старт карьеры» —
  # к подразделам обучения (21.11.2026, по решению владельца вместо «Курсы» / «Семинары»; общие каталоги
  # /kurse/ и /seminare/ остаются, но в меню не выводятся). «Контакты» не показываются, пока нет контактных данных.
  nav:
    - label: "Главная"
      href: /
    - label: "Обучение"
      href: /#obuchenie
    - label: "Грамматика"            # [предложение] короткое название Deutsche Grammatik
      href: /deutsche-grammatik/
    - label: "Старт карьеры"         # [предложение] короткое название Sprachkurse für den Berufseinstieg
      href: /berufseinstieg/
    - label: "Об авторе"
      href: /#avtor
  # Заявка оформляется на странице выбранного курса или семинара, поэтому кнопка ведёт к выбору обучения.
  headerCta:
    label: "Оставить заявку"
    href: /#obuchenie
  footerNav:
    - label: "Impressum"
      href: /impressum/
    - label: "Datenschutz"
      href: /datenschutz/
  form:
    title: "Заявка"
    labels:
      name: "Имя"
      email: "Email"
      phone: "Телефон"
      message: "Комментарий"
      # Текст согласия требует юридической проверки (см. docs/open-questions.md).
      consent: "Я согласен(на) на обработку персональных данных согласно политике конфиденциальности."
      submit: "Отправить заявку"
      optional: "необязательно"
    states:
      sending: "Отправляем…"
      success: "Спасибо! Заявка отправлена. Мы ответим на указанный email."
      error: "Не удалось отправить заявку. Ваши данные сохранены в форме — попробуйте ещё раз."
      retry: "Отправить ещё раз"
    errors:
      required: "Заполните это поле."
      too_short: "Слишком коротко."
      too_long: "Слишком длинно."
      invalid: "Проверьте значение."
      rate_limited: "Слишком много заявок подряд. Попробуйте через несколько минут."
      unknown_product: "Этот курс или семинар сейчас недоступен для записи."
