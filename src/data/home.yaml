# Тексты главной страницы. Ключ `content` — обязательная обёртка.
# Схема полей: src/lib/schemas.ts → homeSchema.
#
# Происхождение текстов (для согласования):
#   [материалы] — формулировки из материалов проекта (бриф главной страницы, 16.11.2026);
#   [предложение] — редакционная формулировка Claude для связности страницы, требует согласования.
content:
  seo:
    title: "Немецкая грамматика как система"                                   # [предложение]
    description: "Deutsch mit Akzent: авторская онлайн-школа для уровня A2–B1: систематизация грамматики, практика и уверенное применение немецкого."  # [предложение]

  hero:
    eyebrow: "Немецкий для уровня A2–B1"                                         # [материалы: аудитория]
    title: "Немецкая грамматика: [[система]], а не набор правил"          # [материалы: позиционирование]; [[ ]] — акцент цветом
    lead: "Для тех, кто уже знает немецкий: связываем знакомые правила между собой и доводим их применение до уверенности."  # [предложение на основе методики]
    primaryCta:
      label: "Выбрать обучение"                                                  # [предложение]
      href: /#obuchenie
    secondaryLinks:                                                              # как в меню (21.11.2026)
      - label: "Грамматика"
        href: /deutsche-grammatik/
      - label: "Старт карьеры"
        href: /berufseinstieg/
    # Фон первого экрана: src/assets/library/hero-reader*.jpg (сгенерировано владельцем)
    imageAlt: "Девушка с ноутбуком и книгами задумалась в старинной библиотеке"     # [предложение]

  directions:
    eyebrow: "Обучение"
    title: "Выберите направление"                                # [предложение]
    # Подразделы, курсы и семинары — src/data/directions.yaml и src/content/{courses,seminars}/

  philosophy:
    statement: "Ошибки: нормальная часть изучения языка."                        # [материалы: философия]
    text: "Не нужно быть идеальным, чтобы продолжать учиться. Обучение проходит без давления и стеснения."  # [материалы: философия]
    example:                                                                     # [предложение]: иллюстрация, не цитата ученика
      wrong: "Ich habe nach Hause gegangen."
      right: "Ich bin nach Hause gegangen."
      note: "Ошибка показывает, какую связь в системе стоит разобрать."

  method:
    eyebrow: "Методика"
    title: "Знания не нужно собирать заново"                                     # [материалы]
    lead: "Их можно систематизировать, связать между собой и научиться применять."  # [материалы]
    steps:
      - title: "Взаимосвязи"
        text: "Разбираем, как грамматические конструкции связаны между собой, а не учим правила по отдельности."  # [материалы]
      - title: "Тематические блоки"
        text: "Систематизируем знания по темам, чтобы правила складывались в целое."  # [материалы]
      - title: "Повторение"
        text: "Последовательно возвращаемся к материалу и закрепляем его."       # [материалы]
      - title: "Практика"
        text: "Практические задания доводят применение теории до автоматизма."  # [материалы]

  results:
    eyebrow: "Результат"
    title: "Что меняется в процессе обучения"                                    # [предложение]
    items:                                                                       # [материалы]
      - "Вы лучше понимаете грамматические взаимосвязи"
      - "Увереннее применяете знакомые правила"
      - "Лучше замечаете и исправляете собственные ошибки"
      - "Точнее выражаете свои мысли"
      - "Чувствуете больше уверенности, когда говорите по-немецки"

  author:
    eyebrow: "Об авторе"
    title: "Автор методики"                                                      # [предложение]
    name: null           # нужно имя преподавателя
    text: "Задача преподавателя: помочь разобраться в немецком и научиться увереннее им пользоваться."  # [материалы: философия]; нужна краткая биография
    photoPlaceholder: "Здесь будет фотография преподавателя"                    # временно, пока нет фото
    # link: { label: "Подробнее об авторе", href: /ob-avtore/ }   # страница «Об авторе» ещё не создана

  closing:
    title: "Dein Deutsch. Dein Weg. Dein Fortschritt."                          # слоган
    text: "Выберите формат, с которого удобно начать."                           # [предложение]
    links:                                                                       # как в меню (21.11.2026)
      - label: "Грамматика"
        href: /deutsche-grammatik/
      - label: "Старт карьеры"
        href: /berufseinstieg/
